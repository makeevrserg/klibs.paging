# Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Gradle
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.isolated-projects=false
org.gradle.jvmargs=-Xmx8G -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8G"
org.gradle.parallel=true
org.gradle.tooling.parallel=true
# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.js.compiler=ir
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
# Android
klibs.android.sdk.min=21
klibs.android.sdk.target=33
klibs.android.sdk.compile=33
# Java
klibs.java.source=8
klibs.java.target=17
klibs.java.ktarget=17
# Project
klibs.project.name=Paging
klibs.project.group=ru.astrainteractive.klibs
klibs.project.version.string=2.12.0
klibs.project.description=Kotlin Multiplatform paging library
klibs.project.developers=makeevrserg|Makeev Roman|makeevrserg@gmail.com
klibs.project.url=https://github.com/makeevrserg/klibs.paging
# Publish
klibs.publish.repo.name=klibs.paging
klibs.publish.groupId=ru.astrainteractive.klibs
klibs.publish.description=Kotlin Multiplatform paging library
klibs.publish.repo.org=makeevrserg
klibs.publish.name=klibs.paging
